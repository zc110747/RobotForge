[pytest]
# =============================================================================
# RobotForge 测试配置
# -----------------------------------------------------------------------------
# ★ 为什么 testpaths 包含 packages/
#   `packages/<id>/tests/` 放的是**这台机器人的构造事实**
#   （关节顺序、连杆长度、限位、往返精度）。
#   它们不写进 testpaths 的话，`pytest -q` 会显示全绿而**从未执行**它们 ——
#   那是"伪造通过"，比没有测试更糟。
#
# ★ 为什么允许显式传路径
#   `pytest tests/test_fk.py -q` 这类窄范围调用工作时很常用（快得多）。
#   显式路径会**覆盖** testpaths，两条用法并存。
#
# ★ 为什么设 pythonpath = .
#   让 `import backend.model...` 与 `import packages...` 都能工作，
#   而不必 `pip install -e .`（v0.1 保持"克隆即可跑测试"）。
# =============================================================================
testpaths =
    tests
    packages

pythonpath = .

python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --tb=short

asyncio_mode = auto

markers =
    phase0: Phase 0 验收（项目初始化 / 契约冻结）
    phase1: Phase 1 验收（MJCF + RobotModel）
    phase2: Phase 2 验收（Three.js 渲染）
    phase3: Phase 3 验收（FK / IK）
    phase4: Phase 4 验收（Runtime + WebSocket）
    phase5: Phase 5 验收（MuJoCo Sim2Sim）
    baseline: 基线回归测试（每个 Phase 后必跑）
    slow: 较慢的测试（MuJoCo 编译 / 积分循环）
